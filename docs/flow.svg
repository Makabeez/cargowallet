<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="250" viewBox="0 0 1100 250" role="img" aria-label="Escrow lifecycle: create, fund, confirm delivery, claim — or refund after the deadline">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07142A"/>
      <stop offset="1" stop-color="#0B2340"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#3B5A82"/>
    </marker>
  </defs>
  <rect width="1100" height="250" rx="18" fill="url(#bg)"/>
  <g font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif">
    <!-- step boxes -->
    <g>
      <rect x="30" y="50" width="220" height="96" rx="14" fill="#0F2744" stroke="#2A4A72"/>
      <text x="50" y="80" font-size="13" font-weight="700" fill="#2DD4BF">1 · CREATE</text>
      <text x="50" y="104" font-size="15" font-weight="600" fill="#F1F5F9">createShipment()</text>
      <text x="50" y="126" font-size="12.5" fill="#94A8C0">AWB hash · split · amount · deadline</text>
    </g>
    <g>
      <rect x="295" y="50" width="220" height="96" rx="14" fill="#0F2744" stroke="#2A4A72"/>
      <text x="315" y="80" font-size="13" font-weight="700" fill="#2DD4BF">2 · FUND</text>
      <text x="315" y="104" font-size="15" font-weight="600" fill="#F1F5F9">approve → fund()</text>
      <text x="315" y="126" font-size="12.5" fill="#94A8C0">USDC locked in the contract</text>
    </g>
    <g>
      <rect x="560" y="50" width="220" height="96" rx="14" fill="#0E3A3A" stroke="#2DD4BF"/>
      <text x="580" y="80" font-size="13" font-weight="700" fill="#2DD4BF">3 · DELIVERED</text>
      <text x="580" y="104" font-size="15" font-weight="600" fill="#F1F5F9">confirmDelivery()</text>
      <text x="580" y="126" font-size="12.5" fill="#94A8C0">credits carrier + handler</text>
    </g>
    <g>
      <rect x="825" y="50" width="245" height="96" rx="14" fill="#0F2744" stroke="#2A4A72"/>
      <text x="845" y="80" font-size="13" font-weight="700" fill="#2DD4BF">4 · PAID</text>
      <text x="845" y="104" font-size="15" font-weight="600" fill="#F1F5F9">claim()</text>
      <text x="845" y="126" font-size="12.5" fill="#94A8C0">each party pulls its USDC</text>
    </g>
    <!-- refund branch -->
    <rect x="295" y="182" width="485" height="44" rx="12" fill="#2A1620" stroke="#7F3B4C"/>
    <text x="315" y="209" font-size="13.5" fill="#F4C7D1"><tspan font-weight="700" fill="#FB7185">NOT DELIVERED · </tspan>refund() after the deadline returns the full amount to the forwarder</text>
  </g>
  <path d="M250 98 H293" stroke="#3B5A82" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M515 98 H558" stroke="#3B5A82" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M780 98 H823" stroke="#3B5A82" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M405 146 V180" stroke="#7F3B4C" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arr)"/>
  <!-- step-by-step highlight -->
  <rect x="30" y="50" width="220" height="96" rx="14" fill="none" stroke="#5EEAD4" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0.000;0.030;0.220;0.250;1.000"/></rect>
  <rect x="295" y="50" width="220" height="96" rx="14" fill="none" stroke="#5EEAD4" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.000;0.250;0.280;0.470;0.500;1.000"/></rect>
  <rect x="560" y="50" width="220" height="96" rx="14" fill="none" stroke="#5EEAD4" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.000;0.500;0.530;0.720;0.750;1.000"/></rect>
  <rect x="825" y="50" width="245" height="96" rx="14" fill="none" stroke="#5EEAD4" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0.000;0.750;0.780;0.970;1.000"/></rect>
  <g stroke="#2DD4BF" stroke-width="2" stroke-dasharray="5 6" fill="none"><path d="M250 98 H293"/><path d="M515 98 H558"/><path d="M780 98 H823"/><animate attributeName="stroke-dashoffset" from="0" to="-22" dur="1s" repeatCount="indefinite"/></g>
  <text x="30" y="30" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="2" fill="#5B7290">ESCROW LIFECYCLE · Created → Funded → Released | Refunded | Cancelled</text>
</svg>
