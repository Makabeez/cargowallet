<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="CargoWallet — USDC escrow for air freight on Arc mainnet">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050E1D"/>
      <stop offset="1" stop-color="#0B2340"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E40AF"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1B3354" stroke-width="1" opacity="0.45"/>
    </pattern>
    <symbol id="plane" viewBox="-12 -12 24 24">
      <path d="M11 0 L-3 -2 L-7 -9 L-9.5 -9 L-6.5 -1.6 L-10 -1.4 L-11.5 -4 L-12.5 -4 L-11.6 0 L-12.5 4 L-11.5 4 L-10 1.4 L-6.5 1.6 L-9.5 9 L-7 9 L-3 2 Z" fill="#F1F5F9"/>
    </symbol>
    <symbol id="coin" viewBox="-10 -10 20 20">
      <circle r="9" fill="#2775CA" stroke="#9CC3F5" stroke-width="1.2"/>
      <text y="4.5" text-anchor="middle" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#fff">$</text>
    </symbol>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <rect width="1280" height="360" fill="url(#glow)"/>

  <!-- left: identity -->
  <g font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif">
    <rect x="72" y="70" width="64" height="64" rx="16" fill="url(#tile)"/>
    <use href="#plane" x="84" y="82" width="40" height="40" transform="rotate(-30 104 102)"/>
    <text x="72" y="172" font-size="15" font-weight="600" letter-spacing="2.5" fill="#2DD4BF">ARC MAINNET · BUILT IN ARC STUDIO</text>
    <text x="68" y="236" font-size="66" font-weight="800" fill="#F1F5F9" letter-spacing="-1.5">CargoWallet</text>
    <text x="72" y="276" font-size="21" fill="#94A8C0">USDC escrow for air freight.</text>
    <text x="72" y="304" font-size="21" fill="#94A8C0">Paid on delivery, not in 30 days.</text>
  </g>

  <!-- right: flight route -->
  <path id="route" d="M640 250 C 760 70, 1060 70, 1190 210" fill="none" stroke="#2DD4BF" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="6 9">
    <animate attributeName="stroke-dashoffset" from="0" to="-60" dur="2s" repeatCount="indefinite"/>
  </path>
  <circle cx="640" cy="250" r="5" fill="#2DD4BF"/>
  <circle cx="1190" cy="210" r="5" fill="#2DD4BF"/>
  <use href="#plane" x="-16" y="-16" width="32" height="32">
    <animateMotion dur="6s" repeatCount="indefinite" rotate="auto" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
      <mpath href="#route"/>
    </animateMotion>
  </use>

  <!-- money flow nodes -->
  <g font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" text-anchor="middle">
    <rect x="580" y="270" width="120" height="40" rx="10" fill="#0F2744" stroke="#2A4A72"/>
    <text x="640" y="295" fill="#CBD5E1">Forwarder</text>

    <rect x="830" y="270" width="140" height="40" rx="10" fill="#0E3A3A" stroke="#2DD4BF"/>
    <text x="900" y="295" fill="#5EEAD4">AirCargoEscrow</text>

    <rect x="1110" y="240" width="130" height="34" rx="10" fill="#0F2744" stroke="#2A4A72"/>
    <text x="1175" y="262" fill="#CBD5E1">Carrier · 70%</text>
    <rect x="1110" y="286" width="130" height="34" rx="10" fill="#0F2744" stroke="#2A4A72"/>
    <text x="1175" y="308" fill="#CBD5E1">Handler · 30%</text>
  </g>
  <path id="leg1" d="M700 290 H830" stroke="#2A4A72" stroke-width="2"/>
  <path id="leg2" d="M970 290 C 1030 290, 1050 257, 1110 257" fill="none" stroke="#2A4A72" stroke-width="2"/>
  <path id="leg3" d="M970 290 C 1030 290, 1050 303, 1110 303" fill="none" stroke="#2A4A72" stroke-width="2"/>

  <!-- coins: lock, then release -->
  <use href="#coin" x="-9" y="-9" width="18" height="18" opacity="0">
    <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.05;0.35;1" calcMode="linear"><mpath href="#leg1"/></animateMotion>
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.05;0.33;0.38;1"/>
  </use>
  <use href="#coin" x="-9" y="-9" width="18" height="18" opacity="0">
    <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.55;0.85;1" calcMode="linear"><mpath href="#leg2"/></animateMotion>
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.54;0.56;0.84;0.9;1"/>
  </use>
  <use href="#coin" x="-7" y="-7" width="14" height="14" opacity="0">
    <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.55;0.85;1" calcMode="linear"><mpath href="#leg3"/></animateMotion>
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.54;0.56;0.84;0.9;1"/>
  </use>
  <!-- escrow pulse while locked -->
  <rect x="830" y="270" width="140" height="40" rx="10" fill="none" stroke="#2DD4BF" stroke-width="2" opacity="0">
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;0.9;0.2;0.9;0;0" keyTimes="0;0.34;0.4;0.46;0.52;0.56;1"/>
  </rect>
  <text x="900" y="335" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#5EEAD4" opacity="0">
    USDC locked · awaiting delivery
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.34;0.38;0.52;0.56;1"/>
  </text>
  <text x="1175" y="346" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#5EEAD4" opacity="0">
    claimed in seconds
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.84;0.88;0.97;1"/>
  </text>
</svg>
